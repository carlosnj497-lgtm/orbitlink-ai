# Compila o APK do app-gateway mobile.
# - Manual (Actions → "Build Mobile Gateway APK" → Run workflow): APK como artefato.
# - Tag v* (ex.: git tag v0.3.1 && git push origin v0.3.1): também publica o APK e um
#   latest.json no repositório PÚBLICO de releases (só binários; o código fica aqui). O app
#   lê esse latest.json pelo backend para se atualizar (ASTRYON_RELEASE_MANIFEST_URL).
#   Sem o secret RELEASES_TOKEN o job de publicação REPROVA: release em tag não pode
#   terminar verde publicando nada.
#
# Configuração (Settings → Secrets and variables → Actions):
#   secret   RELEASES_TOKEN          token com "Contents: read and write" só no repo público de releases
#   variável ASTRYON_RELEASES_REPO   repo público (padrão carlosnj497-lgtm/astryon-releases)
#
# Segurança: o build (que gera pastas de plataforma e roda flutter) só tem leitura. A publicação roda num job
# separado, sem o Flutter, e é o único com acesso ao secret de release.
# Actions fixadas por SHA (comentário = tag de origem); atualize com o Dependabot ou `git ls-remote`.
name: Build Mobile Gateway APK

on:
  workflow_dispatch:
  push:
    # `paths` só é avaliado em pushes de branch; tags disparam sempre.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "prototypes/mobile-gateway/app/**"
      - ".github/workflows/build-mobile-gateway.yml"

permissions:
  contents: read

env:
  RELEASES_REPO: ${{ vars.ASTRYON_RELEASES_REPO || 'carlosnj497-lgtm/astryon-releases' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototypes/mobile-gateway/app/astryon_mobile
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Configure Android manifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>' "$MANIFEST"
          # O protótipo usa HTTP na rede local; habilita tráfego não criptografado.
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' "$MANIFEST"
          # Nome exibido no ícone do app.
          sed -i 's|android:label="[^"]*"|android:label="ASTRYON"|' "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Remove generated template test
        run: rm -f test/widget_test.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -nE 's/^version:[[:space:]]*([^+ ]+).*/\1/p' pubspec.yaml | head -n1)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: >-
          flutter build apk --release
          --build-name=${{ steps.version.outputs.version }}
          --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: astryon-mobile-gateway-apk
          path: prototypes/mobile-gateway/app/astryon_mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: astryon-mobile-gateway-apk
          path: dist

      - name: Publish release (APK + latest.json) no repo público de releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta o secret RELEASES_TOKEN: o APK e o latest.json não foram publicados. Configure o secret em Settings → Secrets and variables → Actions e re-dispare este workflow na tag."
            exit 1
          fi

          apk="$(find dist -name '*.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::APK não encontrado no artefato."
            exit 1
          fi

          asset="astryon-mobile-${VERSION}.apk"
          cp "$apk" "$asset"
          sha="$(sha256sum "$asset" | awk '{print $1}')"
          size="$(stat -c %s "$asset")"
          url="https://github.com/${RELEASES_REPO}/releases/download/${TAG}/${asset}"

          # Notas da release: mensagem da tag anotada; senão, um texto padrão.
          notes="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$notes" ]; then
            notes="App-gateway ASTRYON ${VERSION} para Android."
          fi
          printf '%s\n' "$notes" > release-notes.md

          python3 - "$VERSION" "$url" "$sha" "$size" "$asset" "$notes" > latest.json <<'PY'
          import json, sys
          version, url, sha256, size, filename, notes = sys.argv[1:7]
          print(json.dumps(
              {
                  "version": version,
                  "url": url,
                  "sha256": sha256,
                  "size": int(size),
                  "filename": filename,
                  "notes": notes.strip(),
              },
              ensure_ascii=False,
              indent=2,
          ))
          PY

          gh release view "$TAG" -R "$RELEASES_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$RELEASES_REPO" \
                 --title "ASTRYON Mobile Gateway ${VERSION}" \
                 --notes-file release-notes.md
          # O APK primeiro; o latest.json por último, para ninguém ver a versão nova antes do arquivo existir.
          gh release upload "$TAG" -R "$RELEASES_REPO" "$asset" --clobber
          gh release upload "$TAG" -R "$RELEASES_REPO" latest.json --clobber
          echo "Publicado $asset e latest.json na release $TAG de $RELEASES_REPO"
