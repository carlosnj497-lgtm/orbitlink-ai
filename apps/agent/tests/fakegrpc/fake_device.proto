// SCHEMA SINTÉTICO PARA TESTES — NÃO é o proto oficial da SpaceX.
// Imita o formato público da API local (serviço SpaceX.API.Device.Device, RPC único Handle com oneof)
// para exercitar o caminho real de gRPC reflection do ASTRYON. Numeração de campos arbitrária.
syntax = "proto3";

package SpaceX.API.Device;

service Device {
  rpc Handle (Request) returns (Response) {}
}

message GetStatusRequest {}
message GetHistoryRequest {}
message GetDeviceInfoRequest {}
message RebootRequest {}
message DishGetObstructionMapRequest {}
message GetDiagnosticsRequest {}

message Request {
  uint64 id = 1;
  oneof request {
    RebootRequest reboot = 1001;
    GetStatusRequest get_status = 1004;
    GetHistoryRequest get_history = 1007;
    GetDeviceInfoRequest get_device_info = 1008;
    DishGetObstructionMapRequest dish_get_obstruction_map = 3008;
    GetDiagnosticsRequest get_diagnostics = 6000;
  }
}

message DeviceInfo {
  string id = 1;
  string hardware_version = 2;
  string software_version = 3;
  string country_code = 4;
  int32 bootcount = 5;
  int32 board_rev = 6;
  int32 generation_number = 7;
}

message DeviceState { uint64 uptime_s = 1; }

message DishAlerts {
  bool motors_stuck = 1;
  bool thermal_throttle = 2;
  bool thermal_shutdown = 3;
  bool slow_ethernet_speeds = 4;
  bool roaming = 5;
  bool is_heating = 6;
  bool power_supply_thermal_throttle = 7;
}

message DishOutage {
  enum Cause {
    UNKNOWN = 0;
    BOOTING = 1;
    STOWED = 2;
    THERMAL_SHUTDOWN = 3;
    NO_SCHEDULE = 4;
    NO_SATS = 5;
    OBSTRUCTED = 6;
    NO_DOWNLINK = 7;
    NO_PINGS = 8;
    ACTUATOR_ACTIVITY = 9;
    CABLE_TEST = 10;
    SLEEPING = 11;
  }
  Cause cause = 1;
  uint64 start_timestamp_ns = 2;
  uint64 duration_ns = 3;
  bool did_switch = 4;
}

message DishObstructionStats {
  bool currently_obstructed = 1;
  float fraction_obstructed = 2;
  float valid_s = 3;
}

message DishGpsStats {
  bool gps_valid = 1;
  uint32 gps_sats = 2;
}

message DishGetStatusResponse {
  DeviceInfo device_info = 1;
  DeviceState device_state = 2;
  float pop_ping_drop_rate = 3;
  float downlink_throughput_bps = 4;
  float uplink_throughput_bps = 5;
  float pop_ping_latency_ms = 6;
  DishAlerts alerts = 7;
  DishOutage outage = 8;
  DishObstructionStats obstruction_stats = 9;
  DishGpsStats gps_stats = 10;
  int32 eth_speed_mbps = 11;
  bool is_snr_above_noise_floor = 12;
}

message DishGetHistoryResponse {
  uint64 current = 1;
  repeated float pop_ping_drop_rate = 2;
  repeated float pop_ping_latency_ms = 3;
  repeated float downlink_throughput_bps = 4;
  repeated float uplink_throughput_bps = 5;
  repeated float power_in = 6;
  repeated DishOutage outages = 7;
}

message GetDeviceInfoResponse { DeviceInfo device_info = 1; }
message RebootResponse {}

message DishGetObstructionMapResponse {
  uint32 num_rows = 1;
  uint32 num_cols = 2;
  repeated float snr = 3;
  float min_elevation_deg = 4;
  float max_theta_deg = 5;
}

message Response {
  uint64 id = 1;
  oneof response {
    RebootResponse reboot = 1001;
    GetDeviceInfoResponse get_device_info = 1004;
    DishGetStatusResponse dish_get_status = 2004;
    DishGetHistoryResponse dish_get_history = 2006;
    DishGetObstructionMapResponse dish_get_obstruction_map = 2008;
  }
}
