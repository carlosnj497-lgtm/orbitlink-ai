; OrbitLink AI — firmware do nó de telemetria ESP32.
; Escolha: PlatformIO + framework Arduino (bibliotecas maduras para Wi-Fi provisioning, JSON e sensores;
; compilação e gravação simples no Windows via USB). ESP-IDF puro seria mais verboso sem ganho para este caso.
;
; Ambientes:
;   esp32dev          — apenas a placa: heartbeat, RSSI, uptime (padrão; nenhum sensor elétrico é inventado)
;   esp32dev_sensors  — habilita drivers opcionais (INA219, DS18B20, entrada de queda de energia). Ajuste include/config.h

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -DOL_FW_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=1

[env:esp32dev]
build_flags =
  ${env.build_flags}
  -DOL_ENABLE_INA219=0
  -DOL_ENABLE_DS18B20=0
  -DOL_ENABLE_POWER_SENSE=0

[env:esp32dev_sensors]
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit INA219@^1.2.3
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
build_flags =
  ${env.build_flags}
  -DOL_ENABLE_INA219=1
  -DOL_ENABLE_DS18B20=1
  -DOL_ENABLE_POWER_SENSE=1
