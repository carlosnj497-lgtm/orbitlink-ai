<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05080f">
<title>ASTRYON · sem conexão</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #05080f; color: #e8f1ff;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 420px; text-align: center; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #9fb0c8; margin: 0 0 12px; }
  button { margin-top: 8px; background: #0e7fc0; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Não foi possível falar com o servidor do ASTRYON</h1>
  <p>O celular está sem internet, o Tailscale está desligado ou o servidor está fora do ar.</p>
  <p>Os alertas continuam chegando pelo Telegram enquanto o servidor estiver ligado.</p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
