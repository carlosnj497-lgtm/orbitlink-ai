# ASTRYON — cabeçalhos de segurança (/etc/nginx/snippets/astryon-headers.conf)
# No Nginx, um "add_header" dentro de um location ANULA todos os add_header herdados do server. Por isso este
# snippet é incluído no server E em todo location que define add_header próprio (ex.: o stream SSE).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
