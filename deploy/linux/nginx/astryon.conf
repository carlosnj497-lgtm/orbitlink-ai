# ASTRYON — proxy reverso (instalado em /etc/nginx/sites-available/astryon pelo install.sh).
# Publica SOMENTE o painel Next.js (127.0.0.1:3000). O agente (8787) nunca é publicado: o painel fala com ele
# internamente. Acesso limitado à LAN e à Tailnet pela ACL (snippets/astryon-acl.conf) E pelo UFW.
# O instalador troca o marcador de nomes das diretivas "server_name" pelos nomes deste servidor.

limit_req_zone $binary_remote_addr zone=astryon_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=astryon_api:10m rate=20r/s;

# Catch-all: requisição com "Host" desconhecido (DNS rebinding, varredura) é encerrada sem resposta (444).
# Quem acessa por IP não envia SNI, então o handshake TLS acontece neste servidor: por isso os parâmetros
# ssl_* são os mesmos do servidor do painel. Depois do handshake, o Nginx escolhe o servidor pelo "Host".
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/astryon/tls/astryon.crt;
    ssl_certificate_key /etc/astryon/tls/astryon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:astryon_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 444;
}

# Nomes aceitos (iguais nos dois servidores abaixo): os nomes deste servidor, "localhost", qualquer IP literal
# (um ataque de DNS rebinding sempre chega com um NOME no "Host", nunca com um IP) e o nome MagicDNS do
# Tailscale (*.ts.net não pode ser apontado por terceiros para a sua rede).
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__ localhost
                ~^\d+\.\d+\.\d+\.\d+$
                ~^\[[0-9a-f:]+\]$
                ~^[a-z0-9-]+\.[a-z0-9-]+\.ts\.net$;
    server_tokens off;
    include /etc/nginx/snippets/astryon-acl.conf;

    # O "return" roda na fase rewrite, ANTES do allow/deny (fase access), mesmo dentro de um location.
    # O try_files roda depois da ACL: quem está fora dela recebe 403, e só os demais são redirecionados.
    location / { try_files /.astryon-inexistente @https; }
    location @https { return 301 https://$host$request_uri; }
}

server {
    # Ubuntu 24.04 traz Nginx 1.24: http2 é declarado no "listen" (a diretiva "http2 on" só existe a partir da 1.25.1)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__ localhost
                ~^\d+\.\d+\.\d+\.\d+$
                ~^\[[0-9a-f:]+\]$
                ~^[a-z0-9-]+\.[a-z0-9-]+\.ts\.net$;
    server_tokens off;

    ssl_certificate     /etc/astryon/tls/astryon.crt;
    ssl_certificate_key /etc/astryon/tls/astryon.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:astryon_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/astryon-acl.conf;

    client_max_body_size 4m;   # importação de CSV (até ~2,5 MB)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Nenhuma rota do agente é exposta diretamente
    location ^~ /v1/ { return 404; }
    location ^~ /esp32/ { return 404; }

    # Stream SSE (status ao vivo): sem buffer, conexão longa
    location = /api/agent/stream {
        include /etc/nginx/snippets/astryon-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering "no" always;
    }

    # Login/setup: limite de taxa por IP (o agente também limita)
    location ^~ /api/auth/ {
        limit_req zone=astryon_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/astryon-proxy.conf;
    }

    location ^~ /api/ {
        limit_req zone=astryon_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/astryon-proxy.conf;
        proxy_read_timeout 120s;   # relatórios PDF e diagnóstico
    }

    location / {
        include /etc/nginx/snippets/astryon-proxy.conf;
    }
}
