# OrbitLink AI — cabeçalhos de proxy comuns (/etc/nginx/snippets/orbitlink-proxy.conf)
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Sobrescreve (não concatena): o painel usa este valor para limitar tentativas de login por IP
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_connect_timeout 5s;
# proxy_read_timeout NÃO entra aqui: o Nginx recusa a diretiva repetida no mesmo bloco, e os locations de
# streaming e de API definem o próprio valor. Onde nada é definido vale o padrão do Nginx (60s).
