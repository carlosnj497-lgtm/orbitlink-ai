# OrbitLink AI — endurecimento opcional do SSH (/etc/ssh/sshd_config.d/50-orbitlink-hardening.conf)
# Aplicado SOMENTE com `install.sh --harden-ssh`, e apenas se o usuário que executou o sudo tiver uma chave
# em ~/.ssh/authorized_keys (evita trancar você fora). Validado com `sshd -t` antes de recarregar.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
MaxAuthTries 4
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
