publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  http: ^1.1.0
  mobile_scanner: ^7.5.0
  shared_preferences: ^2.2.2
