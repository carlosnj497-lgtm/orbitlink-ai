services:
  api:
    build: ../backend
    restart: unless-stopped
    environment:
      - ASTRYON_DB_PATH=/data/gateway.db
    volumes:
      - astryon_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  astryon_data:
  caddy_data:
  caddy_config:
